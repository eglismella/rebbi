[project]
name = "rebbi"
version = "0.1.0"
description = "Lend spare token budget between AI agents: broker, ledger and MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",                # the gateway forwards model calls with it
    "claude-agent-sdk>=0.2.174",  # the fleet harness and the demo run their agents with it
    "python-dotenv>=1.0",         # the harness reads credentials from .env
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rebbi = "rebbi.__main__:main"
rebbi-mcp = "rebbi.mcp_server:main"

[project.urls]
Repository = "https://github.com/eglismella/rebbi"
"Agent interface" = "https://github.com/eglismella/rebbi/blob/main/docs/AGENT_INTERFACE.md"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rebbi*"]

[tool.setuptools.package-data]
rebbi = ["starter_fleet.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: starts the real agent CLI against a scripted fake model (slow)"]
