[project]
name = "rebbi"
version = "0.1.0"
description = "Lend spare token budget between AI agents: broker, ledger and MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rebbi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: starts the real agent CLI against a scripted fake model (slow)"]
