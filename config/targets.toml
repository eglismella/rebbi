# Repositories dep-audit-v1 can audit, each pinned to one tagged commit, with the answer key the
# verifier checks a report against. `python -m rebbi fetch-target --all` clones them; `--target NAME`
# picks one for a run. config/scenario.toml's [target] is the demo's default (sqlite-utils-3.38).
#
# Picked on Nov 3 for the HW7 benchmark, before any benchmark run: small Python packages by the same
# author whose setup.py lists its dependencies literally (the only manifest scripts/make_answer_key.py
# reads). datasette 0.65.1 was considered and dropped: it vendors another library, so its key is
# ambiguous. Every key was drafted by the script and checked by hand against the source.
#
# expected_tokens is what the auditor is told past audits cost. It is one job-level figure for every
# target, the largest audit measured on sqlite-utils 3.38, because the others were never measured.

["sqlite-utils-3.38"]
repo = "https://github.com/simonw/sqlite-utils"
commit = "9d7da0606e98713896bbc9fc885a5b0cd54ac2fd"
local_path = "targets/sqlite-utils"
key = "specs/answer-key-sqlite-utils-3.38.json"
expected_tokens = 60000

